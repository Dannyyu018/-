<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 16px;
    padding: 32px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  h1 { font-size: 22px; color: #333; margin-bottom: 20px; text-align: center; }
  .output {
    display: flex; gap: 8px; margin-bottom: 20px;
  }
  #pwd {
    flex: 1; border: 2px solid #e0e0e0; border-radius: 8px;
    padding: 12px; font-size: 16px; font-family: Consolas, monospace;
    color: #333; word-break: break-all; background: #f9f9f9;
  }
  .btn {
    border: none; border-radius: 8px; padding: 12px 16px;
    font-size: 15px; cursor: pointer; transition: .2s; font-weight: 600;
  }
  .btn:active { transform: scale(.96); }
  .copy { background: #667eea; color: #fff; }
  .copy:hover { background: #5568d8; }
  .gen {
    width: 100%; background: #764ba2; color: #fff;
    padding: 14px; font-size: 16px; margin-bottom: 20px;
  }
  .gen:hover { background: #653a8a; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; justify-content: space-between;
    background: #f5f5f7; border-radius: 8px; padding: 10px 14px; font-size: 15px; color: #444;
  }
  input[type=number] {
    width: 70px; padding: 6px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 15px; text-align: center;
  }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #667eea; }
  .strength { margin-top: 16px; text-align: center; font-size: 14px; color: #888; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 密码生成器</h1>
  <div class="output">
    <div id="pwd">点击下方按钮生成</div>
    <button class="btn copy" onclick="copyPwd()">复制</button>
  </div>
  <button class="btn gen" onclick="gen()">生成密码</button>
  <div class="opts">
    <label class="opt">长度
      <input type="number" id="len" min="4" max="64" value="16">
    </label>
    <label class="opt">大写字母 (A-Z) <input type="checkbox" id="upper" checked></label>
    <label class="opt">小写字母 (a-z) <input type="checkbox" id="lower" checked></label>
    <label class="opt">数字 (0-9) <input type="checkbox" id="num" checked></label>
    <label class="opt">符号 (!@#$%) <input type="checkbox" id="sym" checked></label>
  </div>
  <div class="strength" id="strength"></div>
</div>

<script>
function gen() {
  const len = +document.getElementById('len').value;
  if (len < 4 || len > 64) { alert('长度需在 4-64 之间'); return; }
  const sets = [];
  if (document.getElementById('upper').checked) sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
  if (document.getElementById('lower').checked) sets.push('abcdefghijklmnopqrstuvwxyz');
  if (document.getElementById('num').checked) sets.push('0123456789');
  if (document.getElementById('sym').checked) sets.push('!@#$%^&*()-_=+[]{};:,.<>?');
  if (!sets.length) { alert('至少选择一种字符类型'); return; }

  // 每类至少 1 个，剩余随机
  const chars = [];
  sets.forEach(s => chars.push(s[Math.floor(Math.random() * s.length)]));
  const all = sets.join('');
  while (chars.length < len) chars.push(all[Math.floor(Math.random() * all.length)]);
  // 打乱顺序
  for (let i = chars.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [chars[i], chars[j]] = [chars[j], chars[i]];
  }
  const pwd = chars.join('');
  document.getElementById('pwd').textContent = pwd;
  showStrength(pwd);
}

function showStrength(pwd) {
  let score = 0;
  if (pwd.length >= 12) score++;
  if (pwd.length >= 16) score++;
  if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
  if (/\d/.test(pwd)) score++;
  if (/[!@#$%^&*()\-_=+\[\]{};:,.<>?]/.test(pwd)) score++;
  const map = ['弱 😟', '中 🙂', '强 😊', '很强 😎', '极强 🛡️', '极强 🛡️'];
  document.getElementById('strength').textContent = '强度：' + map[score];
}

function copyPwd() {
  const text = document.getElementById('pwd').textContent;
  if (text.startsWith('点击')) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy');
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

// 页面打开自动生成一次
gen();
</script>
</body>
</html>
